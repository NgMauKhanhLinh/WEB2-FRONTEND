<aside class="sidebar">
  <nav class="sidebar-menu" aria-label="Điều hướng tài khoản">
    @for (item of menuItems; track item) {
      <a
        class="sidebar-item"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        ariaCurrentWhenActive="page"
      >
        @if (item.icon === 'user') {
          <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M4.5 21a7.5 7.5 0 0 1 15 0"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        }
        @if (item.icon === 'paw') {
          <svg class="sidebar-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M19.0803 15.7199C18.4903 12.1899 15.1003 9.31995 11.5203 9.31995C7.63028 9.31995 4.21028 12.4699 3.88028 16.3499C3.75028 17.8499 4.23028 19.2699 5.22028 20.3399C6.20028 21.4099 7.58028 21.9999 9.08028 21.9999H13.7603C15.4503 21.9999 16.9303 21.3399 17.9403 20.1499C18.9503 18.9599 19.3503 17.3799 19.0803 15.7199Z"
            />
            <path
              d="M10.2796 7.86C11.8978 7.86 13.2096 6.54819 13.2096 4.93C13.2096 3.31181 11.8978 2 10.2796 2C8.66141 2 7.34961 3.31181 7.34961 4.93C7.34961 6.54819 8.66141 7.86 10.2796 7.86Z"
            />
            <path
              d="M16.94 9.03002C18.2876 9.03002 19.38 7.9376 19.38 6.59002C19.38 5.24245 18.2876 4.15002 16.94 4.15002C15.5924 4.15002 14.5 5.24245 14.5 6.59002C14.5 7.9376 15.5924 9.03002 16.94 9.03002Z"
            />
            <path
              d="M20.5496 12.93C21.6266 12.93 22.4996 12.057 22.4996 10.98C22.4996 9.90307 21.6266 9.03003 20.5496 9.03003C19.4727 9.03003 18.5996 9.90307 18.5996 10.98C18.5996 12.057 19.4727 12.93 20.5496 12.93Z"
            />
            <path
              d="M3.94 10.98C5.28757 10.98 6.38 9.88755 6.38 8.53998C6.38 7.1924 5.28757 6.09998 3.94 6.09998C2.59243 6.09998 1.5 7.1924 1.5 8.53998C1.5 9.88755 2.59243 10.98 3.94 10.98Z"
            />
          </svg>
        }
        @if (item.icon === 'calendar') {
          <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect
              x="3"
              y="5"
              width="18"
              height="16"
              rx="2"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M16 3v4M8 3v4M3 10h18"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        }
        @if (item.icon === 'shopping') {
          <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="10" cy="20" r="1.2" fill="currentColor" />
            <circle cx="18" cy="20" r="1.2" fill="currentColor" />
          </svg>
        }
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <button class="sidebar-item sidebar-logout" type="button" (click)="logout()">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 16l4-4-4-4M18 12H9"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span>Đăng xuất</span>
  </button>
</aside>
