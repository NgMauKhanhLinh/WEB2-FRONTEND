name: Angular CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/angular-auth-migration]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: npm test -- --watch=false
