<div class="login-container">
  <div class="login-card">
    <h1>Đăng nhập</h1>
    <p>Đăng nhập để quản lý hồ sơ và lịch chăm sóc thú cưng.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="account">Số điện thoại hoặc email</label>
        <input
          id="account"
          type="text"
          formControlName="account"
          autocomplete="username"
          placeholder="Nhập số điện thoại hoặc email"
        />
        <div *ngIf="loginForm.get('account')?.touched && loginForm.get('account')?.invalid" class="error-text">
          <small *ngIf="loginForm.get('account')?.errors?.['required']">Vui lòng nhập số điện thoại hoặc email.</small>
          <small *ngIf="loginForm.get('account')?.errors?.['account']">Số điện thoại hoặc email chưa đúng định dạng.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Nhập mật khẩu"
        />
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error-text">
          <small *ngIf="loginForm.get('password')?.errors?.['required']">Mật khẩu không được để trống.</small>
        </div>
      </div>

      <label class="remember-option">
        <input type="checkbox" formControlName="remember" />
        Ghi nhớ đăng nhập
      </label>

      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isLoading" class="btn-submit">
        {{ isLoading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Mở giao diện xác thực đầy đủ</a>
    </div>
  </div>
</div>
